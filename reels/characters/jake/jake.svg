<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" id="jake-root">
  <!--
    Jake: same rig topology as Alex (reels/characters/alex/alex.svg) - only
    the hair differs (a relaxed side-swept sweep instead of 3 spikes) to be
    visually distinct while sharing the exact art style/proportions, per
    "recurring, recognizable, consistent" characters built on one engine.
    Same left/right (viewer-perspective) convention as alex.svg - see there
    for the full explanation.
  -->
  <g id="jake-style" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <g id="jake-pelvis" transform="translate(200,430)">

      <g id="jake-torso" transform="translate(0,0)">
        <rect x="-50" y="-160" width="100" height="160" rx="40" fill="white"/>

        <g id="jake-neck" transform="translate(0,-160)">
          <line x1="0" y1="0" x2="0" y2="-25"/>

          <g id="jake-head" transform="translate(0,-25)">
            <circle cx="0" cy="-65" r="65" fill="white"/>

            <g id="jake-hair" transform="translate(0,-130)">
              <path d="M -35,10 Q -20,-10 5,-6 Q 25,-3 38,8" fill="none"/>
            </g>

            <g id="jake-left-eyebrow" transform="translate(-25,-88)">
              <path d="M -12,0 Q 0,-8 12,0"/>
            </g>
            <g id="jake-right-eyebrow" transform="translate(25,-88)">
              <path d="M -12,0 Q 0,-8 12,0"/>
            </g>

            <g id="jake-left-eye" transform="translate(-25,-70)">
              <circle class="eye-open" r="6" fill="#1a1a1a" stroke="none"/>
              <path class="eye-closed" d="M -7,1 Q 0,-6 7,1" stroke="#1a1a1a" stroke-width="3" fill="none" display="none"/>
            </g>
            <g id="jake-right-eye" transform="translate(25,-70)">
              <circle class="eye-open" r="6" fill="#1a1a1a" stroke="none"/>
              <path class="eye-closed" d="M -7,1 Q 0,-6 7,1" stroke="#1a1a1a" stroke-width="3" fill="none" display="none"/>
            </g>

            <g id="jake-mouth" transform="translate(0,-42)">
              <path d="M -18,0 Q 0,14 18,0"/>
            </g>
          </g>
        </g>

        <g id="jake-left-upper-arm" transform="translate(-50,-145)">
          <line x1="0" y1="0" x2="-18" y2="95"/>
          <g id="jake-left-forearm" transform="translate(-18,95)">
            <line x1="0" y1="0" x2="-6" y2="90"/>
            <g id="jake-left-hand" transform="translate(-6,90)">
              <circle r="15" fill="white"/>
            </g>
          </g>
        </g>

        <g id="jake-right-upper-arm" transform="translate(50,-145)">
          <line x1="0" y1="0" x2="18" y2="95"/>
          <g id="jake-right-forearm" transform="translate(18,95)">
            <line x1="0" y1="0" x2="6" y2="90"/>
            <g id="jake-right-hand" transform="translate(6,90)">
              <circle r="15" fill="white"/>
            </g>
          </g>
        </g>
      </g>

      <g id="jake-left-thigh" transform="translate(-25,0)">
        <line x1="0" y1="0" x2="-8" y2="135"/>
        <g id="jake-left-shin" transform="translate(-8,135)">
          <line x1="0" y1="0" x2="0" y2="135"/>
          <g id="jake-left-foot" transform="translate(0,135)">
            <ellipse cx="-18" cy="4" rx="32" ry="14" fill="white"/>
          </g>
        </g>
      </g>

      <g id="jake-right-thigh" transform="translate(25,0)">
        <line x1="0" y1="0" x2="8" y2="135"/>
        <g id="jake-right-shin" transform="translate(8,135)">
          <line x1="0" y1="0" x2="0" y2="135"/>
          <g id="jake-right-foot" transform="translate(0,135)">
            <ellipse cx="18" cy="4" rx="32" ry="14" fill="white"/>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
