<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" id="alex-root">
  <!--
    Rest pose (neutral standing, arms at sides). Every persistent part has a
    stable id (alex-*) per the character spec. Parent-child SVG <g> nesting
    mirrors the rig hierarchy exactly (ROOT > pelvis > torso > ... ) so a
    later Python rig layer only has to set transform="translate(x,y)
    rotate(a)" on each named group - SVG's native transform composition
    handles forward-kinematics for free, the same way OpenToonz's rigid
    Skeleton Tool / Synfig's "link to bone" mode drive cutout pieces.

    Coordinates on each <g> are LOCAL offsets from the immediate parent's
    origin (not canvas-absolute) - standard nested-rig convention.

    LEFT/RIGHT CONVENTION (documented explicitly to avoid ambiguity once
    scene logic references "left arm"/"right arm"): "left"/"right" in every
    id is VIEWER/SCREEN perspective, not the character's own anatomical
    left/right. alex-left-* is always the screen-left side as drawn here
    (character facing the viewer). This matches how a 2D scene author will
    think about layout ("Alex's left arm points toward the chart on the
    left of frame"), not mirror-anatomy. If a future pose ever turns the
    character around, this convention must be resolved explicitly then -
    do not silently flip it.
  -->
  <g id="alex-style" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <g id="alex-pelvis" transform="translate(200,430)">

      <g id="alex-torso" transform="translate(0,0)">
        <rect x="-50" y="-160" width="100" height="160" rx="40" fill="white"/>

        <g id="alex-neck" transform="translate(0,-160)">
          <line x1="0" y1="0" x2="0" y2="-25"/>

          <g id="alex-head" transform="translate(0,-25)">
            <circle cx="0" cy="-65" r="65" fill="white"/>

            <g id="alex-hair" transform="translate(0,-130)">
              <line x1="-22" y1="0" x2="-28" y2="-30"/>
              <line x1="0" y1="-4" x2="2" y2="-36"/>
              <line x1="22" y1="0" x2="30" y2="-28"/>
            </g>

            <g id="alex-left-eyebrow" transform="translate(-25,-88)">
              <path d="M -12,0 Q 0,-8 12,0"/>
            </g>
            <g id="alex-right-eyebrow" transform="translate(25,-88)">
              <path d="M -12,0 Q 0,-8 12,0"/>
            </g>

            <g id="alex-left-eye" transform="translate(-25,-70)">
              <circle r="6" fill="#1a1a1a" stroke="none"/>
            </g>
            <g id="alex-right-eye" transform="translate(25,-70)">
              <circle r="6" fill="#1a1a1a" stroke="none"/>
            </g>

            <g id="alex-mouth" transform="translate(0,-42)">
              <path d="M -18,0 Q 0,14 18,0"/>
            </g>
          </g>
        </g>

        <g id="alex-left-upper-arm" transform="translate(-50,-145)">
          <line x1="0" y1="0" x2="-18" y2="95"/>
          <g id="alex-left-forearm" transform="translate(-18,95)">
            <line x1="0" y1="0" x2="-6" y2="90"/>
            <g id="alex-left-hand" transform="translate(-6,90)">
              <circle r="15" fill="white"/>
            </g>
          </g>
        </g>

        <g id="alex-right-upper-arm" transform="translate(50,-145)">
          <line x1="0" y1="0" x2="18" y2="95"/>
          <g id="alex-right-forearm" transform="translate(18,95)">
            <line x1="0" y1="0" x2="6" y2="90"/>
            <g id="alex-right-hand" transform="translate(6,90)">
              <circle r="15" fill="white"/>
            </g>
          </g>
        </g>
      </g>

      <g id="alex-left-thigh" transform="translate(-25,0)">
        <line x1="0" y1="0" x2="-8" y2="135"/>
        <g id="alex-left-shin" transform="translate(-8,135)">
          <line x1="0" y1="0" x2="0" y2="135"/>
          <g id="alex-left-foot" transform="translate(0,135)">
            <ellipse cx="-18" cy="4" rx="32" ry="14" fill="white"/>
          </g>
        </g>
      </g>

      <g id="alex-right-thigh" transform="translate(25,0)">
        <line x1="0" y1="0" x2="8" y2="135"/>
        <g id="alex-right-shin" transform="translate(8,135)">
          <line x1="0" y1="0" x2="0" y2="135"/>
          <g id="alex-right-foot" transform="translate(0,135)">
            <ellipse cx="18" cy="4" rx="32" ry="14" fill="white"/>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
