name: CoinSignal Auto Blog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "20 2 * * *"
    - cron: "40 4 * * *"
    - cron: "0 7 * * *"
    - cron: "20 9 * * *"
    - cron: "40 11 * * *"
    - cron: "0 14 * * *"
    - cron: "20 16 * * *"
    - cron: "40 18 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests feedparser huggingface_hub pillow

      - name: Generate and Publish 4 Articles
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import html
          import subprocess
          from pathlib import Path

          import requests
          import feedparser
          from huggingface_hub import InferenceClient

          # ============================================================
          # CONFIG
          # ============================================================

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get("GEMINI_MODEL") or "gemini-3.6-flash"

          HF_TOKEN = os.environ["HF_TOKEN"]

          BLOG_ID = os.environ["BLOGGER_BLOG_ID"]
          CLIENT_ID = os.environ["GOOGLE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["GOOGLE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["GOOGLE_REFRESH_TOKEN"]

          IMAGE_MODEL = "black-forest-labs/FLUX.1-schnell"
          RSS_URL = "https://cointelegraph.com/rss"

          ARTICLES_PER_RUN = 4
          IMAGE_DIR = Path("generated_images")
          IMAGE_DIR.mkdir(exist_ok=True)

          STATE_FILE = Path("published_sources.json")

          # ============================================================
          # GIT CONFIG
          # ============================================================

          subprocess.run(
              ["git", "config", "user.name", "CoinSignal Bot"],
              check=True
          )
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "coinsignal-bot@users.noreply.github.com"
              ],
              check=True
          )

          # ============================================================
          # DUPLICATE TRACKING
          # ============================================================

          if STATE_FILE.exists():
              try:
                  state = json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  state = []
          else:
              state = []

          if not isinstance(state, list):
              state = []

          # This source was already published successfully by the old
          # one-article workflow, so do not publish it again.
          already_published_from_old_workflow = (
              "https://cointelegraph.com/news/"
              "hong-kong-jails-former-banker-over-16b-false-credit-"
              "cryptocurrency-bribes-report"
              "?utm_source=rss_feed&utm_medium=rss&utm_campaign="
              "rss_partner_inbound"
          )

          if (
              already_published_from_old_workflow
              not in state
          ):
              state.append(
                  already_published_from_old_workflow
              )

          published_sources = set(state)

          print(
              "Previously published sources:",
              len(published_sources)
          )

          # ============================================================
          # RSS
          # ============================================================

          print("")
          print("Fetching crypto news...")

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              raise Exception("No RSS articles found.")

          articles = []

          for entry in feed.entries[:30]:
              title = getattr(entry, "title", "").strip()
              link = getattr(entry, "link", "").strip()

              if not title or not link:
                  continue

              if link in published_sources:
                  print("SKIPPING ALREADY PUBLISHED:", title)
                  continue

              articles.append({
                  "title": title,
                  "link": link
              })

              if len(articles) >= ARTICLES_PER_RUN:
                  break

          if not articles:
              raise Exception(
                  "No new RSS articles available for this run."
              )

          print("")
          print(
              f"Selected {len(articles)} new article(s) "
              f"for this run."
          )

          for i, item in enumerate(articles, 1):
              print(
                  f"{i}. {item['title']}"
              )

          # ============================================================
          # GEMINI JSON CLEANER
          # ============================================================

          def clean_json_text(text):
              text = text.strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              start = text.find("{")
              end = text.rfind("}")

              if start != -1 and end != -1:
                  text = text[start:end + 1]

              text = "".join(
                  ch if ord(ch) >= 32 or ch in "\n\t\r" else " "
                  for ch in text
              )

              return text.strip()

          # ============================================================
          # GEMINI ARTICLE
          # ============================================================

          def generate_article(source):

              url = (
                  f"https://generativelanguage.googleapis.com/"
                  f"v1beta/models/{GEMINI_MODEL}:generateContent"
              )

              prompt = f"""
          You are a professional crypto and financial journalist writing for CoinSignal.

          Create an original, human-sounding, SEO-friendly crypto news article
          based on the following current news topic:

          SOURCE TITLE:
          {source["title"]}

          SOURCE URL:
          {source["link"]}

          Requirements:

          - Do not copy the source article.
          - Write an original article.
          - 900-1200 words.
          - Strong SEO title.
          - Attractive introduction.
          - Use H2 and H3 headings.
          - Explain important facts clearly.
          - Include relevant Bitcoin/crypto context where appropriate.
          - Avoid fake quotes.
          - Do not invent statistics.
          - Do not make unsupported claims.
          - Keep the tone professional but engaging.
          - Include a short conclusion.
          - Include SEO-friendly HTML only inside html_content.
          - Do NOT include markdown.
          - Return ONLY valid JSON.

          Required JSON format:

          {{
            "seo_title": "Article title",
            "html_content": "<p>...</p><h2>...</h2>...",
            "labels": ["Crypto News", "Crypto", "Blockchain", "Markets"]
          }}
          """

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.7,
                      "responseMimeType": "application/json"
                  }
              }

              last_error = None

              for attempt in range(6):
                  try:
                      print(
                          f"ARTICLE ATTEMPT {attempt + 1}/6"
                      )

                      response = requests.post(
                          url,
                          headers={
                              "x-goog-api-key": GEMINI_API_KEY,
                              "Content-Type": "application/json"
                          },
                          json=payload,
                          timeout=180
                      )

                      if response.status_code in [
                          429, 500, 502, 503, 504
                      ]:
                          print(
                              f"Gemini returned {response.status_code}"
                          )

                          wait = min(
                              60 * (attempt + 1),
                              300
                          )

                          print(
                              f"Waiting {wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                      response.raise_for_status()

                      data = response.json()

                      text = (
                          data["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      cleaned = clean_json_text(text)

                      try:
                          result = json.loads(
                              cleaned,
                              strict=False
                          )
                      except json.JSONDecodeError:
                          cleaned = (
                              cleaned
                              .replace("\r", " ")
                              .replace("\n", " ")
                              .replace("\t", " ")
                          )

                          result = json.loads(
                              cleaned,
                              strict=False
                          )

                      if (
                          "seo_title" not in result
                          or "html_content" not in result
                      ):
                          raise Exception(
                              "Gemini JSON missing required fields."
                          )

                      return result

                  except Exception as e:
                      last_error = e

                      print(
                          "ARTICLE ERROR:",
                          str(e)
                      )

                      if attempt < 5:
                          wait = min(
                              60 * (attempt + 1),
                              300
                          )

                          print(
                              f"Retrying in {wait} seconds..."
                          )

                          time.sleep(wait)

              raise Exception(
                  f"Article generation failed: {last_error}"
              )

          # ============================================================
          # HUGGING FACE IMAGE
          # ============================================================

          def generate_image(prompt, output_file):

              print("")
              print("Starting Hugging Face image generation...")
              print("Model:", IMAGE_MODEL)

              client = InferenceClient(
                  provider="auto",
                  api_key=HF_TOKEN
              )

              last_error = None

              for attempt in range(12):
                  try:
                      print(
                          f"IMAGE ATTEMPT {attempt + 1}/12"
                      )

                      image = client.text_to_image(
                          prompt=prompt,
                          model=IMAGE_MODEL
                      )

                      image.save(output_file)

                      print(
                          "IMAGE GENERATED:",
                          output_file
                      )

                      return True

                  except Exception as e:
                      last_error = e
                      error_text = str(e)

                      print(
                          "IMAGE ERROR:",
                          error_text
                      )

                      if any(
                          code in error_text
                          for code in [
                              "429",
                              "500",
                              "502",
                              "503",
                              "504",
                              "Too Many Requests",
                              "rate limit",
                              "temporarily unavailable"
                          ]
                      ):
                          wait = min(
                              300 * (attempt + 1),
                              900
                          )

                          print(
                              "Image service temporarily unavailable."
                          )
                          print(
                              f"Waiting {wait} seconds before retry..."
                          )

                          time.sleep(wait)
                          continue

                      print(
                          "Non-retryable image error."
                      )
                      break

              print(
                  "IMAGE GENERATION FAILED:",
                  last_error
              )

              return False

          # ============================================================
          # GOOGLE OAUTH
          # ============================================================

          print("")
          print("Refreshing Google OAuth token...")

          token_response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": CLIENT_ID,
                  "client_secret": CLIENT_SECRET,
                  "refresh_token": REFRESH_TOKEN,
                  "grant_type": "refresh_token"
              },
              timeout=60
          )

          token_response.raise_for_status()

          access_token = token_response.json()["access_token"]

          # ============================================================
          # BLOGGER URL
          # ============================================================

          blogger_url = (
              f"https://www.googleapis.com/blogger/v3/blogs/"
              f"{BLOG_ID}/posts/"
          )

          # ============================================================
          # PROCESS 4 ARTICLES SEQUENTIALLY
          # ============================================================

          successful = 0
          failed = 0

          print("")
          print("====================================")
          print(f"STARTING BATCH: {len(articles)} ARTICLES")
          print("====================================")

          for article_number, source in enumerate(
              articles, 1
          ):

              print("")
              print("####################################")
              print(
                  f"ARTICLE {article_number}/{len(articles)}"
              )
              print("SOURCE:", source["title"])
              print("####################################")

              try:

                  # ----------------------------
                  # Generate article
                  # ----------------------------

                  article = generate_article(source)

                  print("")
                  print(
                      "ARTICLE TITLE:",
                      article["seo_title"]
                  )

                  # ----------------------------
                  # Generate image
                  # ----------------------------

                  safe_name = re.sub(
                      r"[^a-zA-Z0-9_-]+",
                      "-",
                      article["seo_title"].lower()
                  )[:80].strip("-")

                  image_path = (
                      IMAGE_DIR /
                      f"{safe_name}.png"
                  )

                  image_prompt = f"""
          Create a professional editorial image for a cryptocurrency
          news article.

          Article headline:
          {article["seo_title"]}

          Style:
          premium financial news photography,
          modern cryptocurrency market atmosphere,
          Bitcoin and blockchain visual elements where relevant,
          realistic lighting,
          sophisticated newsroom/editorial aesthetic,
          cinematic composition,
          high detail,
          no text,
          no logos,
          no watermarks,
          16:9 landscape composition.
          """

                  image_ok = generate_image(
                      image_prompt,
                      image_path
                  )

                  # ----------------------------
                  # GitHub image URL
                  # ----------------------------

                  image_url = None

                  if image_ok:

                      subprocess.run(
                          ["git", "add", str(image_path)],
                          check=True
                      )

                      commit = subprocess.run(
                          [
                              "git",
                              "commit",
                              "-m",
                              (
                                  "Add image for "
                                  f"{article['seo_title']}"
                              )
                          ],
                          capture_output=True,
                          text=True
                      )

                      if commit.returncode == 0:
                          subprocess.run(
                              ["git", "push"],
                              check=True
                          )
                      else:
                          print(
                              "Image commit returned no changes."
                          )

                      repo = os.environ.get(
                          "GITHUB_REPOSITORY",
                          "waqas4868/coinsignal-auto-blog"
                      )

                      image_url = (
                          "https://raw.githubusercontent.com/"
                          f"{repo}/main/"
                          f"{image_path.as_posix()}"
                      )

                      print(
                          "IMAGE URL:",
                          image_url
                      )

                  # ----------------------------
                  # Add image to article
                  # ----------------------------

                  html_content = article["html_content"]

                  if image_url:

                      image_html = f"""
          <p style="text-align:center;">
          <img
            src="{image_url}"
            alt="{html.escape(article["seo_title"])}"
            style="max-width:100%;height:auto;"
            loading="lazy"
          />
          </p>
          """

                      html_content = (
                          image_html +
                          html_content
                      )

                  else:
                      print(
                          "Image unavailable. "
                          "Publishing article without image."
                      )

                  # ----------------------------
                  # Blogger publish
                  # ----------------------------

                  print("Publishing to Blogger...")

                  labels = article.get(
                      "labels",
                      [
                          "Crypto News",
                          "Crypto",
                          "Blockchain",
                          "Markets"
                      ]
                  )

                  blogger_payload = {
                      "kind": "blogger#post",
                      "title": article["seo_title"],
                      "content": html_content,
                      "labels": labels
                  }

                  blogger_response = requests.post(
                      blogger_url,
                      headers={
                          "Authorization":
                              f"Bearer {access_token}",
                          "Content-Type":
                              "application/json"
                      },
                      json=blogger_payload,
                      timeout=120
                  )

                  blogger_response.raise_for_status()

                  published = blogger_response.json()

                  print("")
                  print("====================================")
                  print("SUCCESS")
                  print("====================================")
                  print(
                      "ARTICLE:",
                      f"{article_number}/{len(articles)}"
                  )
                  print(
                      "TITLE:",
                      article["seo_title"]
                  )
                  print(
                      "BLOGGER URL:",
                      published.get("url")
                  )
                  print(
                      "IMAGE:",
                      "YES" if image_url else "NO"
                  )
                  print("====================================")

                  # ----------------------------
                  # Mark source as published
                  # ----------------------------

                  if source["link"] not in published_sources:
                      published_sources.add(
                          source["link"]
                      )
                      state.append(
                          source["link"]
                      )

                      STATE_FILE.write_text(
                          json.dumps(
                              state,
                              indent=2,
                              ensure_ascii=False
                          ),
                          encoding="utf-8"
                      )

                      subprocess.run(
                          ["git", "add", str(STATE_FILE)],
                          check=True
                      )

                      state_commit = subprocess.run(
                          [
                              "git",
                              "commit",
                              "-m",
                              (
                                  "Track published source: "
                                  f"{article['seo_title']}"
                              )
                          ],
                          capture_output=True,
                          text=True
                      )

                      if state_commit.returncode == 0:
                          subprocess.run(
                              ["git", "push"],
                              check=True
                          )

                  successful += 1

              except Exception as e:

                  failed += 1

                  print("")
                  print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")
                  print(
                      f"ARTICLE {article_number} FAILED"
                  )
                  print(
                      "ERROR:",
                      str(e)
                  )
                  print(
                      "Continuing with next article..."
                  )
                  print("!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!")

                  continue

          # ============================================================
          # FINAL REPORT
          # ============================================================

          print("")
          print("====================================")
          print("BATCH COMPLETE")
          print("====================================")
          print(
              "REQUESTED:",
              ARTICLES_PER_RUN
          )
          print(
              "SELECTED:",
              len(articles)
          )
          print(
              "PUBLISHED:",
              successful
          )
          print(
              "FAILED:",
              failed
          )
          print("====================================")

          if successful == 0:
              raise Exception(
                  "No articles were published successfully."
              )

          PY
