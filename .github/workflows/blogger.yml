name: CoinSignal Auto Blog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "20 2 * * *"
    - cron: "40 4 * * *"
    - cron: "0 7 * * *"
    - cron: "20 9 * * *"
    - cron: "40 11 * * *"
    - cron: "0 14 * * *"
    - cron: "20 16 * * *"
    - cron: "40 18 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Generate article, images and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

        run: |
          python <<'PY'
          import os
          import json
          import requests
          import feedparser
          import base64
          import re
          import time
          from datetime import datetime, timezone

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          )

          IMAGE_MODEL = "gemini-3.1-flash-image"
          BLOG_ID = os.environ["BLOGGER_BLOG_ID"]

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y%m%d-%H%M%S")

          # ==================================================
          # 1. FETCH CURRENT CRYPTO NEWS
          # ==================================================

          feed = feedparser.parse(
              "https://cointelegraph.com/rss"
          )

          if not feed.entries:
              raise Exception(
                  "No crypto news items were found."
              )

          entries = feed.entries[:10]

          source_context = ""

          for i, item in enumerate(entries, 1):
              source_context += f"""
          SOURCE {i}
          Title: {item.get("title", "")}
          Date: {item.get("published", "")}
          URL: {item.get("link", "")}
          Summary: {item.get("summary", "")}
          """

          # ==================================================
          # 2. ARTICLE PROMPT
          # ==================================================

          prompt = f"""
          You are the senior crypto journalist for CoinSignal.

          Use ONLY the supplied current news sources below
          for factual claims.

          CURRENT DATE:
          {now.strftime("%Y-%m-%d")}

          NEWS SOURCES:
          {source_context}

          TASK:

          Select ONE genuinely current and useful
          cryptocurrency topic from the supplied sources.

          Write a 1200–1500 word publication-ready
          CoinSignal article.

          Requirements:
          - Create an SEO-friendly title.
          - Use H2 and H3 headings.
          - Use short mobile-friendly paragraphs.
          - Base factual claims only on supplied sources.
          - Do not invent prices, statistics, quotes,
            regulations, partnerships, events or market data.
          - Clearly distinguish reported facts from analysis.
          - Attribute reported information naturally.
          - Do not make guaranteed-profit claims.
          - Include relevant risks and uncertainty.
          - End with a "Key Takeaways" section.
          - End with a short cryptocurrency risk disclaimer.
          - Return clean HTML only.
          - Do NOT use Markdown.
          - Do NOT include html/head/body tags.

          VERY IMPORTANT:

          Return ONLY valid JSON.

          Escape all quotation marks inside HTML attributes
          correctly.

          Do not put literal newlines or control characters
          inside JSON string values.

          JSON FORMAT:

          {{
            "seo_title": "Article title",
            "html_content": "<p>Article HTML here</p>",
            "labels": [
              "Crypto",
              "Bitcoin",
              "Cryptocurrency News",
              "Market Analysis",
              "Blockchain"
            ]
          }}
          """

          # ==================================================
          # 3. CLEAN GEMINI JSON
          # ==================================================

          def clean_json_text(text):

              text = text.strip()

              # Remove markdown code fences
              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              text = text.strip()

              # Find the actual JSON object
              start = text.find("{")
              end = text.rfind("}")

              if start != -1 and end != -1:
                  text = text[start:end + 1]

              # Remove problematic control characters
              text = re.sub(
                  r"[\x00-\x08\x0b\x0c\x0e-\x1f]",
                  " ",
                  text
              )

              return text.strip()

          # ==================================================
          # 4. ARTICLE GENERATION WITH RETRY
          # ==================================================

          def generate_article():

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{GEMINI_MODEL}:generateContent"
                  f"?key={GEMINI_API_KEY}"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.3,
                      "responseMimeType": "application/json"
                  }
              }

              max_attempts = 6

              for attempt in range(
                  1,
                  max_attempts + 1
              ):

                  print(
                      f"ARTICLE ATTEMPT "
                      f"{attempt}/{max_attempts}"
                  )

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=180
                      )

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt == max_attempts:
                              response.raise_for_status()

                          wait_time = min(
                              20 * (2 ** (attempt - 1)),
                              180
                          )

                          print(
                              f"Gemini returned "
                              f"{response.status_code}. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      response.raise_for_status()

                      data = response.json()

                      candidates = data.get(
                          "candidates",
                          []
                      )

                      if not candidates:
                          raise Exception(
                              "Gemini returned no candidates."
                          )

                      parts = (
                          candidates[0]
                          .get("content", {})
                          .get("parts", [])
                      )

                      text = ""

                      for part in parts:
                          if "text" in part:
                              text += part["text"]

                      if not text:
                          raise Exception(
                              "Gemini returned empty article text."
                          )

                      cleaned = clean_json_text(text)

                      try:

                          article = json.loads(
                              cleaned,
                              strict=False
                          )

                      except json.JSONDecodeError as json_error:

                          print(
                              "JSON parsing failed."
                          )

                          print(
                              "Trying JSON repair..."
                          )

                          # Replace remaining raw newlines
                          # inside the response
                          cleaned = cleaned.replace(
                              "\r",
                              " "
                          ).replace(
                              "\n",
                              " "
                          ).replace(
                              "\t",
                              " "
                          )

                          article = json.loads(
                              cleaned,
                              strict=False
                          )

                      if not isinstance(
                          article,
                          dict
                      ):
                          raise Exception(
                              "Gemini response is not a JSON object."
                          )

                      if not article.get(
                          "seo_title"
                      ):
                          raise Exception(
                              "Missing seo_title."
                          )

                      if not article.get(
                          "html_content"
                      ):
                          raise Exception(
                              "Missing html_content."
                          )

                      return article

                  except json.JSONDecodeError as error:

                      if attempt == max_attempts:
                          raise Exception(
                              "Gemini returned invalid JSON "
                              "after multiple attempts."
                          ) from error

                      wait_time = min(
                          10 * attempt,
                          60
                      )

                      print(
                          "Invalid JSON received. "
                          f"Waiting {wait_time} seconds "
                          "before retry..."
                      )

                      time.sleep(wait_time)

                  except (
                      requests.exceptions.Timeout,
                      requests.exceptions.ConnectionError
                  ) as error:

                      if attempt == max_attempts:
                          raise error

                      wait_time = min(
                          20 * (2 ** (attempt - 1)),
                          180
                      )

                      print(
                          "Gemini connection error. "
                          f"Waiting {wait_time} seconds..."
                      )

                      time.sleep(wait_time)

              raise Exception(
                  "Article generation failed."
              )

          article = generate_article()

          title = article["seo_title"]
          content = article["html_content"]

          labels = article.get(
              "labels",
              [
                  "Crypto",
                  "Bitcoin",
                  "Cryptocurrency News",
                  "Market Analysis",
                  "Blockchain"
              ]
          )

          print(
              "ARTICLE TITLE:",
              title
          )

          # ==================================================
          # 5. CREATE IMAGE DIRECTORY
          # ==================================================

          image_dir = "generated-images"

          os.makedirs(
              image_dir,
              exist_ok=True
          )

          safe_title = re.sub(
              r"[^a-zA-Z0-9]+",
              "-",
              title.lower()
          ).strip("-")

          image1_file = (
              f"{image_dir}/"
              f"{safe_title}-{stamp}-1.png"
          )

          image2_file = (
              f"{image_dir}/"
              f"{safe_title}-{stamp}-2.png"
          )

          # ==================================================
          # 6. IMAGE GENERATION WITH RETRY
          # ==================================================

          def generate_image(
              prompt_text,
              output_file
          ):

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/interactions"
              )

              payload = {
                  "model": IMAGE_MODEL,
                  "input": prompt_text,
                  "response_format": {
                      "type": "image",
                      "aspect_ratio": "16:9",
                      "image_size": "1K"
                  }
              }

              max_attempts = 6

              for attempt in range(
                  1,
                  max_attempts + 1
              ):

                  print(
                      f"IMAGE ATTEMPT "
                      f"{attempt}/{max_attempts}"
                  )

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json",
                              "x-goog-api-key":
                                  GEMINI_API_KEY
                          },
                          json=payload,
                          timeout=300
                      )

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt == max_attempts:
                              response.raise_for_status()

                          wait_time = min(
                              30 * (2 ** (attempt - 1)),
                              300
                          )

                          print(
                              f"Image API returned "
                              f"{response.status_code}. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      response.raise_for_status()

                      result = response.json()

                      image_data = None

                      for step in result.get(
                          "steps",
                          []
                      ):

                          if step.get(
                              "type"
                          ) == "model_output":

                              for block in step.get(
                                  "content",
                                  []
                              ):

                                  if block.get(
                                      "type"
                                  ) == "image":

                                      image_data = (
                                          block.get("data")
                                      )

                      if not image_data:
                          raise Exception(
                              "Gemini did not return an image."
                          )

                      with open(
                          output_file,
                          "wb"
                      ) as image_file:

                          image_file.write(
                              base64.b64decode(
                                  image_data
                              )
                          )

                      print(
                          "IMAGE CREATED:",
                          output_file
                      )

                      return

                  except (
                      requests.exceptions.Timeout,
                      requests.exceptions.ConnectionError
                  ) as error:

                      if attempt == max_attempts:
                          raise error

                      wait_time = min(
                          30 * (2 ** (attempt - 1)),
                          300
                      )

                      print(
                          "Image connection error. "
                          f"Waiting {wait_time} seconds..."
                      )

                      time.sleep(wait_time)

              raise Exception(
                  "Image generation failed."
              )

          # ==================================================
          # 7. GENERATE HERO IMAGE
          # ==================================================

          generate_image(

              f"""
          Create an original editorial illustration
          for a professional cryptocurrency news publication.

          Article topic:
          {title}

          Create a modern cinematic crypto-market visual.

          Include abstract blockchain technology,
          digital assets, market charts and
          financial data visualization.

          Do not use real people.
          Do not use celebrity likenesses.
          Do not copy logos or copyrighted artwork.
          Do not include misleading exact prices.
          Do not include unnecessary text.

          Professional financial-news style.
          Wide 16:9 composition.
          Suitable as a blog article hero image.
          """,

              image1_file
          )

          # ==================================================
          # 8. GENERATE SECOND IMAGE
          # ==================================================

          generate_image(

              f"""
          Create a second original editorial image
          for this cryptocurrency article:

          {title}

          Show a sophisticated conceptual visualization
          of the main topic.

          Combine blockchain technology,
          digital finance, market trends
          and investor analysis.

          No real people.
          No celebrity likenesses.
          No copied logos.
          No copyrighted artwork.
          Avoid fake exact statistics or prices.
          Minimal or no text.

          Professional financial journalism aesthetic.
          Wide 16:9 composition.
          """,

              image2_file
          )

          # ==================================================
          # 9. PUSH GENERATED IMAGES TO GITHUB
          # ==================================================

          os.system(
              "git config user.name 'CoinSignal Bot'"
          )

          os.system(
              "git config user.email "
              "'coinsignal-bot@users.
