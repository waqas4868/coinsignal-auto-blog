name: CoinSignal Auto Blog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "20 2 * * *"
    - cron: "40 4 * * *"
    - cron: "0 7 * * *"
    - cron: "20 9 * * *"
    - cron: "40 11 * * *"
    - cron: "0 14 * * *"
    - cron: "20 16 * * *"
    - cron: "40 18 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Generate article, images and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

        run: |
          python <<'PY'
          import os
          import json
          import requests
          import feedparser
          import base64
          import re
          import time
          from datetime import datetime, timezone

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          )

          IMAGE_MODEL = "gemini-3.1-flash-image"
          BLOG_ID = os.environ["BLOGGER_BLOG_ID"]

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y%m%d-%H%M%S")

          # ==================================================
          # 1. FETCH CURRENT CRYPTO NEWS
          # ==================================================

          feed = feedparser.parse(
              "https://cointelegraph.com/rss"
          )

          if not feed.entries:
              raise Exception(
                  "No crypto news items were found."
              )

          entries = feed.entries[:10]

          source_context = ""

          for i, item in enumerate(entries, 1):
              source_context += f"""
          SOURCE {i}
          Title: {item.get("title", "")}
          Date: {item.get("published", "")}
          URL: {item.get("link", "")}
          Summary: {item.get("summary", "")}
          """

          # ==================================================
          # 2. ARTICLE PROMPT
          # ==================================================

          prompt = f"""
          You are the senior crypto journalist for CoinSignal.

          Use ONLY the supplied current news sources below
          for factual claims.

          CURRENT DATE:
          {now.strftime("%Y-%m-%d")}

          NEWS SOURCES:
          {source_context}

          TASK:

          Select ONE genuinely current and useful
          cryptocurrency topic from the supplied sources.

          Write a 1200–1500 word publication-ready
          CoinSignal article.

          Requirements:
          - Create an SEO-friendly title.
          - Use H2 and H3 headings.
          - Use short mobile-friendly paragraphs.
          - Base factual claims only on supplied sources.
          - Do not invent prices, statistics, quotes,
            regulations, partnerships, events or market data.
          - Clearly distinguish reported facts from analysis.
          - Attribute reported information naturally.
          - Do not make guaranteed-profit claims.
          - Include relevant risks and uncertainty.
          - End with a "Key Takeaways" section.
          - End with a short cryptocurrency risk disclaimer.
          - Return clean HTML only.
          - Do NOT use Markdown.
          - Do NOT include html/head/body tags.

          Return ONLY valid JSON:

          {{
            "seo_title": "Article title",
            "html_content": "<p>...</p>",
            "labels": [
              "Crypto",
              "Bitcoin",
              "Cryptocurrency News",
              "Market Analysis",
              "Blockchain"
            ]
          }}
          """

          # ==================================================
          # 3. ARTICLE GENERATION WITH RETRY
          # ==================================================

          def generate_article():

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  f"{GEMINI_MODEL}:generateContent"
                  f"?key={GEMINI_API_KEY}"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.4,
                      "responseMimeType": "application/json"
                  }
              }

              max_attempts = 6

              for attempt in range(1, max_attempts + 1):

                  print(
                      f"ARTICLE ATTEMPT "
                      f"{attempt}/{max_attempts}"
                  )

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json"
                          },
                          json=payload,
                          timeout=180
                      )

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt == max_attempts:
                              response.raise_for_status()

                          wait_time = min(
                              15 * (2 ** (attempt - 1)),
                              180
                          )

                          print(
                              f"Gemini returned "
                              f"{response.status_code}. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      response.raise_for_status()

                      data = response.json()

                      text = (
                          data["candidates"][0]
                          ["content"]["parts"][0]["text"]
                      )

                      return json.loads(text)

                  except (
                      requests.exceptions.Timeout,
                      requests.exceptions.ConnectionError
                  ) as error:

                      if attempt == max_attempts:
                          raise error

                      wait_time = min(
                          15 * (2 ** (attempt - 1)),
                          180
                      )

                      print(
                          "Gemini connection/timeout error. "
                          f"Waiting {wait_time} seconds..."
                      )

                      time.sleep(wait_time)

              raise Exception(
                  "Article generation failed."
              )

          article = generate_article()

          title = article["seo_title"]
          content = article["html_content"]
          labels = article.get("labels", [])

          print("ARTICLE TITLE:", title)

          # ==================================================
          # 4. IMAGE FILES
          # ==================================================

          image_dir = "generated-images"

          os.makedirs(
              image_dir,
              exist_ok=True
          )

          safe_title = re.sub(
              r"[^a-zA-Z0-9]+",
              "-",
              title.lower()
          ).strip("-")

          image1_file = (
              f"{image_dir}/"
              f"{safe_title}-{stamp}-1.png"
          )

          image2_file = (
              f"{image_dir}/"
              f"{safe_title}-{stamp}-2.png"
          )

          # ==================================================
          # 5. IMAGE GENERATION WITH RETRY
          # ==================================================

          def generate_image(
              prompt_text,
              output_file
          ):

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/interactions"
              )

              payload = {
                  "model": IMAGE_MODEL,
                  "input": prompt_text,
                  "response_format": {
                      "type": "image",
                      "aspect_ratio": "16:9",
                      "image_size": "1K"
                  }
              }

              max_attempts = 6

              for attempt in range(1, max_attempts + 1):

                  print(
                      f"IMAGE ATTEMPT "
                      f"{attempt}/{max_attempts}"
                  )

                  try:

                      response = requests.post(
                          endpoint,
                          headers={
                              "Content-Type":
                                  "application/json",
                              "x-goog-api-key":
                                  GEMINI_API_KEY
                          },
                          json=payload,
                          timeout=300
                      )

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          if attempt == max_attempts:
                              response.raise_for_status()

                          wait_time = min(
                              30 * (2 ** (attempt - 1)),
                              300
                          )

                          print(
                              f"Gemini image API returned "
                              f"{response.status_code}. "
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(wait_time)
                          continue

                      response.raise_for_status()

                      result = response.json()

                      image_data = None

                      for step in result.get(
                          "steps",
                          []
                      ):

                          if step.get(
                              "type"
                          ) == "model_output":

                              for block in step.get(
                                  "content",
                                  []
                              ):

                                  if block.get(
                                      "type"
                                  ) == "image":

                                      image_data = (
                                          block.get("data")
                                      )

                      if not image_data:
                          raise Exception(
                              "Gemini did not return an image."
                          )

                      with open(
                          output_file,
                          "wb"
                      ) as f:

                          f.write(
                              base64.b64decode(
                                  image_data
                              )
                          )

                      print(
                          "IMAGE CREATED:",
                          output_file
                      )

                      return

                  except (
                      requests.exceptions.Timeout,
                      requests.exceptions.ConnectionError
                  ) as error:

                      if attempt == max_attempts:
                          raise error

                      wait_time = min(
                          30 * (2 ** (attempt - 1)),
                          300
                      )

                      print(
                          "Image connection/timeout error. "
                          f"Waiting {wait_time} seconds..."
                      )

                      time.sleep(wait_time)

              raise Exception(
                  "Image generation failed."
              )

          # ==================================================
          # 6. HERO IMAGE
          # ==================================================

          generate_image(
              f"""
          Create an original editorial illustration
          for a professional cryptocurrency news publication.

          Article topic:
          {title}

          Create a modern cinematic crypto-market visual.

          Include abstract blockchain technology,
          digital assets, market charts and
          financial data visualization.

          Do not use real people.
          Do not use celebrity likenesses.
          Do not copy logos or copyrighted artwork.
          Do not include misleading exact prices.
          Do not include unnecessary text.

          Professional financial-news style.
          Wide 16:9 composition.
          Suitable as a blog article hero image.
          """,
              image1_file
          )

          # ==================================================
          # 7. SECOND IMAGE
          # ==================================================

          generate_image(
              f"""
          Create a second original editorial image
          for this cryptocurrency article:

          {title}

          Show a sophisticated conceptual visualization
          of the main topic.

          Combine blockchain technology,
          digital finance, market trends
          and investor analysis.

          No real people.
          No celebrity likenesses.
          No copied logos.
          No copyrighted artwork.
          Avoid fake exact statistics or prices.
          Minimal or no text.

          Professional financial journalism aesthetic.
          Wide 16:9 composition.
          """,
              image2_file
          )

          # ==================================================
          # 8. PUSH IMAGES TO GITHUB
          # ==================================================

          os.system(
              "git config user.name 'CoinSignal Bot'"
          )

          os.system(
              "git config user.email "
              "'coinsignal-bot@users.noreply.github.com'"
          )

          os.system(
              "git add generated-images/"
          )

          commit_result = os.system(
              f'git commit -m "Add article images {stamp}"'
          )

          if commit_result == 0:

              push_result = os.system(
                  "git push"
              )

              if push_result != 0:
                  raise Exception(
                      "Failed to push images to GitHub."
                  )

          # ==================================================
          # 9. IMAGE URLS
          # ==================================================

          repo_owner = "waqas4868"
          repo_name = "coinsignal-auto-blog"
          branch = "main"

          image1_url = (
              "https://raw.githubusercontent.com/"
              f"{repo_owner}/{repo_name}/"
              f"{branch}/{image1_file}"
          )

          image2_url = (
              "https://raw.githubusercontent.com/"
              f"{repo_owner}/{repo_name}/"
              f"{branch}/{image2_file}"
          )

          # ==================================================
          # 10. INSERT IMAGES
          # ==================================================

          hero_html = f"""
          <figure>
            <img
              src="{image1_url}"
              alt="{title} cryptocurrency market illustration"
              style="width:100%;height:auto;border-radius:8px;">
            <figcaption>{title}</figcaption>
          </figure>
          """

          second_html = f"""
          <figure>
            <img
              src="{image2_url}"
              alt="{title} blockchain and crypto market analysis illustration"
              style="width:100%;height:auto;border-radius:8px;">
            <figcaption>
              Crypto market analysis and blockchain illustration
            </figcaption>
          </figure>
          """

          paragraphs = content.split("</p>")

          if len(paragraphs) >= 4:

              content = (
                  paragraphs[0]
                  + "</p>"
                  + hero_html
                  + "</p>".join(
                      paragraphs[1:3]
                  )
                  + "</p>"
                  + second_html
                  + "</p>".join(
                      paragraphs[3:]
                  )
              )

          else:

              content = (
                  hero_html
                  + content
                  + second_html
              )

          # ==================================================
          # 11. BLOGGER TOKEN
          # ==================================================

          token_response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id":
                      os.environ["GOOGLE_CLIENT_ID"],
                  "client_secret":
                      os.environ["GOOGLE_CLIENT_SECRET"],
                  "refresh_token":
                      os.environ["GOOGLE_REFRESH_TOKEN"],
                  "grant_type":
                      "refresh_token"
              },
              timeout=60
          )

          token_response.raise_for_status()

          access_token = (
              token_response.json()
              ["access_token"]
          )

          # ==================================================
          # 12. PUBLISH TO BLOGGER
          # ==================================================

          blogger_url = (
              "https://www.googleapis.com/"
              "blogger/v3/blogs/"
              f"{BLOG_ID}/posts"
          )

          post = {
              "kind": "blogger#post",
              "title": title,
              "content": content,
              "labels": labels
          }

          publish_response = requests.post(
              blogger_url,
              headers={
                  "Authorization":
                      f"Bearer {access_token}",
                  "Content-Type":
                      "application/json"
              },
              params={
                  "isDraft": "false"
              },
              json=post,
              timeout=120
          )

          publish_response.raise_for_status()

          result = publish_response.json()

          print("===================================")
          print("SUCCESS")
          print("Title:", title)
          print(
              "Blogger URL:",
              result.get("url")
          )
          print("Image 1:", image1_url)
          print("Image 2:", image2_url)
          print("Labels:", labels)
          print("===================================")

          PY
```0
