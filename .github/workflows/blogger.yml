# CoinSignal Auto Blog production workflow.
#
# The pipeline logic lives in scripts/coinsignal_runtime.py (see CODE_VERSION in
# that file for the current revision). This workflow only handles CI plumbing:
# checkout, pinned dependency install, mode selection, cross-run checkpoint
# caching, and invoking the script.
name: CoinSignal Auto Blog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run publisher, Facebook worker, or both"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - facebook
          - both
  schedule:
    # Publisher: 02:00, 06:00, 10:00, 14:00, 18:00, 22:00 PKT
    - cron: "0 21 * * *"
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    # Facebook worker: 03:00, 11:00, 19:00 PKT
    - cron: "0 22 * * *"
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: coinsignal-final-state-writer
  # Queue scheduled runs instead of cancelling an in-progress one; this alone
  # (no other concurrency key exists in the GitHub Actions schema) is what keeps
  # runs queued rather than silently dropped/replaced.
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
  FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
  FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        # Non-blocking for now: this is visibility, not a release gate. Promote to
        # blocking once the project has a process for triaging/waiving findings.
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Verify Python dependencies
        shell: bash
        run: |
          python - <<'PY'
          import feedparser
          import nh3
          import requests
          from huggingface_hub import InferenceClient
          print("Dependency preflight OK")
          print("feedparser:", getattr(feedparser, "__version__", "unknown"))
          print("requests:", getattr(requests, "__version__", "unknown"))
          print("huggingface_hub:", __import__("huggingface_hub").__version__)
          print("nh3:", getattr(nh3, "__version__", "unknown"))
          print("InferenceClient:", InferenceClient.__name__)
          PY

      - name: Select run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "0 21 * * *"|"0 1 * * *"|"0 5 * * *"|"0 9 * * *"|"0 13 * * *"|"0 17 * * *")
              echo "RUN_MODE=publish" >> "$GITHUB_ENV"
              ;;
            "0 22 * * *"|"0 6 * * *"|"0 14 * * *")
              echo "RUN_MODE=facebook" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported schedule: ${{ github.event.schedule }}"
              exit 1
              ;;
          esac

      - name: Restore publisher checkpoint
        # A crash/failure between Gemini article generation and a successful Blogger
        # publish previously always regenerated the article from scratch on the next
        # run, because publisher_inflight.json only ever lived on the (ephemeral)
        # runner disk. actions/cache lets a checkpoint survive across runs without
        # touching git - the publish-critical path still never depends on git.
        if: env.RUN_MODE == 'publish' || env.RUN_MODE == 'both'
        uses: actions/cache/restore@v4
        with:
          path: publisher_inflight.json
          key: coinsignal-inflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coinsignal-inflight-

      - name: Run CoinSignal automation
        run: python scripts/coinsignal_runtime.py

      - name: Save publisher checkpoint
        # Non-blocking: same principle as the script's own git-persistence steps -
        # checkpoint bookkeeping must never turn a successful/handled run into a
        # failed job. Warns and no-ops if publisher_inflight.json doesn't exist
        # (nothing was in-flight, e.g. the run published successfully and cleaned
        # the file up itself).
        if: always() && (env.RUN_MODE == 'publish' || env.RUN_MODE == 'both')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: publisher_inflight.json
          key: coinsignal-inflight-${{ github.run_id }}-${{ github.run_attempt }}
