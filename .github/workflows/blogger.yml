name: CoinSignal Auto Blog

on:
  workflow_dispatch:
  schedule:
    # 6 runs/day = 02:00, 06:00, 10:00, 14:00, 18:00, 22:00 PKT
    # GitHub Actions cron is UTC (PKT = UTC+5).
    - cron: "0 21 * * *"  # 02:00 PKT
    - cron: "0 1 * * *"   # 06:00 PKT
    - cron: "0 5 * * *"   # 10:00 PKT
    - cron: "0 9 * * *"   # 14:00 PKT
    - cron: "0 13 * * *"  # 18:00 PKT
    - cron: "0 17 * * *"  # 22:00 PKT

permissions:
  contents: write

concurrency:
  group: coinsignal-auto-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests feedparser huggingface_hub pillow

      - name: Generate and Publish CoinSignal Articles
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import html
          import subprocess
          from pathlib import Path

          import requests
          import feedparser
          from huggingface_hub import InferenceClient

          # ============================================================
          # CONFIG
          # ============================================================

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get("GEMINI_MODEL") or "gemini-3.6-flash"
          HF_TOKEN = os.environ["HF_TOKEN"]

          BLOG_ID = os.environ["BLOGGER_BLOG_ID"]
          CLIENT_ID = os.environ["GOOGLE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["GOOGLE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["GOOGLE_REFRESH_TOKEN"]

          FACEBOOK_PAGE_ID = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
          FACEBOOK_PAGE_ACCESS_TOKEN = os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", "").strip()
          FACEBOOK_GRAPH_VERSION = "v23.0"
          FACEBOOK_DAILY_LIMIT = 3
          FACEBOOK_STATE_FILE = Path("facebook_state.json")

          IMAGE_MODEL = "black-forest-labs/FLUX.1-schnell"
          RSS_URL = "https://cointelegraph.com/rss"

          ARTICLES_PER_RUN = 1  # One article per run; 6 scheduled runs/day = 6 articles/day.
          IMAGE_DIR = Path("generated_images")
          IMAGE_DIR.mkdir(exist_ok=True)
          STATE_FILE = Path("published_sources.json")

          GEMINI_MAX_ATTEMPTS = 4
          GEMINI_MIN_GAP_SECONDS = 45
          BLOGGER_REAUTH_ATTEMPTS = 2

          # ============================================================
          # GIT CONFIG
          # ============================================================

          subprocess.run(
              ["git", "config", "user.name", "CoinSignal Bot"],
              check=True
          )
          subprocess.run(
              [
                  "git", "config", "user.email",
                  "coinsignal-bot@users.noreply.github.com"
              ],
              check=True
          )

          # ============================================================
          # DUPLICATE TRACKING HELPERS
          # ============================================================

          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          import hashlib

          def normalize_url(value):
              value = str(value or "").strip()
              if not value:
                  return ""
              try:
                  parts = urlsplit(value)
                  clean_query = [
                      (k, v)
                      for k, v in parse_qsl(parts.query, keep_blank_values=True)
                      if not k.lower().startswith("utm_")
                      and k.lower() not in {
                          "fbclid", "gclid", "mc_cid", "mc_eid"
                      }
                  ]
                  return urlunsplit((
                      parts.scheme.lower(),
                      parts.netloc.lower(),
                      parts.path.rstrip("/"),
                      urlencode(clean_query),
                      ""
                  ))
              except Exception:
                  return value.split("?")[0].rstrip("/")

          def title_fingerprint(value):
              normalized = re.sub(
                  r"[^a-z0-9]+", " ",
                  str(value or "").lower()
              ).strip()
              return hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()

          # ============================================================
          # DUPLICATE TRACKING
          # ============================================================

          if STATE_FILE.exists():
              try:
                  raw_state = json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  raw_state = []
          else:
              raw_state = []

          # Backward compatible with the old list-of-URLs format.
          if isinstance(raw_state, list):
              state = {
                  "urls": list(raw_state),
                  "titles": [],
                  "fingerprints": []
              }
          elif isinstance(raw_state, dict):
              state = {
                  "urls": raw_state.get("urls", []),
                  "titles": raw_state.get("titles", []),
                  "fingerprints": raw_state.get("fingerprints", [])
              }
          else:
              state = {"urls": [], "titles": [], "fingerprints": []}

          published_urls = {
              normalize_url(x) for x in state["urls"] if x
          }
          published_fingerprints = set(
              x for x in state["fingerprints"] if x
          )

          already_published_from_old_workflow = (
              "https://cointelegraph.com/news/"
              "hong-kong-jails-former-banker-over-16b-false-credit-"
              "cryptocurrency-bribes-report"
              "?utm_source=rss_feed&utm_medium=rss&utm_campaign="
              "rss_partner_inbound"
          )

          old_normalized = normalize_url(already_published_from_old_workflow)
          if old_normalized not in published_urls:
              state["urls"].append(already_published_from_old_workflow)
              published_urls.add(old_normalized)

          print("Previously published URLs:", len(published_urls))
          print("Previously published title fingerprints:",
                len(published_fingerprints))

          # ============================================================
          # RSS
          # ============================================================

          print("")
          print("Fetching crypto news...")

          feed = feedparser.parse(RSS_URL)

          if not feed.entries:
              raise Exception("No RSS articles found.")

          articles = []

          # Inspect more RSS candidates first so duplicates do not consume
          # the small per-run article quota.
          for entry in feed.entries[:50]:
              title = getattr(entry, "title", "").strip()
              link = getattr(entry, "link", "").strip()
              summary = (
                  getattr(entry, "summary", "")
                  or getattr(entry, "description", "")
                  or ""
              ).strip()

              if not title or not link:
                  continue

              normalized = normalize_url(link)
              fingerprint = title_fingerprint(title)

              if normalized in published_urls:
                  print("SKIPPING ALREADY PUBLISHED URL:", title)
                  continue

              if fingerprint in published_fingerprints:
                  print("SKIPPING ALREADY PUBLISHED TITLE:", title)
                  continue

              articles.append({
                  "title": title,
                  "link": link,
                  "normalized_link": normalized,
                  "title_fingerprint": fingerprint,
                  "summary": re.sub(r"<[^>]+>", " ", summary)
              })

              if len(articles) >= ARTICLES_PER_RUN:
                  break

          if not articles:
              raise Exception("No new RSS articles available for this run.")

          print("")
          print(f"Selected {len(articles)} new article(s) for this run.")

          for i, item in enumerate(articles, 1):
              print(f"{i}. {item['title']}")

          # ============================================================
          # GEMINI JSON CLEANER
          # ============================================================

          def clean_json_text(text):
              text = text.strip()

              text = re.sub(
                  r"^```(?:json)?\s*",
                  "",
                  text,
                  flags=re.IGNORECASE
              )

              text = re.sub(r"\s*```$", "", text)

              start = text.find("{")
              end = text.rfind("}")

              if start != -1 and end != -1:
                  text = text[start:end + 1]

              text = "".join(
                  ch if ord(ch) >= 32 or ch in "
	
" else " "
                  for ch in text
              )

              return text.strip()

          # ============================================================
          # GEMINI ARTICLE ENGINE
          # ============================================================

          def retry_wait_from_response(response, attempt):
              retry_after = response.headers.get("Retry-After")
              if retry_after:
                  try:
                      return min(max(int(float(retry_after)), 10), 600)
                  except Exception:
                      pass

              # Longer, controlled backoff for quota/service errors.
              waits = [30, 60, 120, 180, 240, 300]
              return waits[min(attempt, len(waits) - 1)]
